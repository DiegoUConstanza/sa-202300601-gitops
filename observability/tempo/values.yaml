# ─────────────────────────────────────────────────────────────────────────────
# Tempo values.yaml — Despliegue Monolítico Ligero
# ─────────────────────────────────────────────────────────────────────────────

tempo:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

resources:
  limits:
    cpu: 300m
    memory: 512Mi
  requests:
    cpu: 30m
    memory: 128Mi

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true
