de Respuestas HTTP 5xx)\",\n      \"description\": \"\xBFQui\xE9n est\xE1 fallando y en qu\xE9 porcentaje?\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"custom\": { \"drawStyle\": \"line\", \"lineInterpolation\": \"smooth\" },\n          \"unit\": \"percentunit\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": { \"h\": 7, \"w\": 12, \"x\": 12, \"y\": 15 },\n      \"id\": 7,\n      \"options\": { \"legend\": { \"displayMode\": \"table\", \"placement\": \"bottom\", \"calcs\": [\"lastNotNull\", \"max\"] } },\n      \"targets\": [\n        {\n          \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n          \"editorMode\": \"code\",\n          \"expr\": \"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\\\"sa-p8-prod\\\",container!=\\\"\\\"}[2m])) / sum by (pod) (container_spec_cpu_quota{namespace=\\\"sa-p8-prod\\\",container!=\\\"\\\"} / 100000)\",\n          \"legendFormat\": \"{{pod}} (CPU vs Limit)\",\n          \"range\": true,\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"Se\xF1al 4: Saturaci\xF3n (Uso de CPU relativo a l\xEDmites)\",\n      \"description\": \"\xBFQu\xE9 tan cerca del l\xEDmite de CPU est\xE1 operando cada Pod?\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"collapsed\": false,\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 22 },\n      \"id\": 300,\n      \"title\": \"3. M\xC9TRICAS DE NEGOCIO Y DESPLIEGUE CANARY\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"custom\": { \"drawStyle\": \"line\" },\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": { \"h\": 7, \"w\": 12, \"x\": 0, \"y\": 23 },\n      \"id\": 8,\n      \"options\": { \"legend\": { \"displayMode\": \"table\", \"placement\": \"bottom\", \"calcs\": [\"lastNotNull\"] } },\n      \"targets\": [\n        {\n          \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n          \"editorMode\": \"code\",\n          \"expr\": \"sum by (resultado) (rate(sa_logins_total[2m]))\",\n          \"legendFormat\": \"Logins ({{resultado}})\",\n          \"range\": true,\n          \"refId\": \"A\"\n        },\n        {\n          \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n          \"editorMode\": \"code\",\n          \"expr\": \"rate(sa_usuarios_registrados_total[2m])\",\n          \"legendFormat\": \"Usuarios Registrados/s\",\n          \"range\": true,\n          \"refId\": \"B\"\n        },\n        {\n          \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n          \"editorMode\": \"code\",\n          \"expr\": \"rate(sa_modulos_completados_total[2m])\",\n          \"legendFormat\": \"M\xF3dulos Completados/s\",\n          \"range\": true,\n          \"refId\": \"C\"\n        }\n      ],\n      \"title\": \"M\xE9tricas de Negocio\",\n      \"description\": \"\xBFEst\xE1 ocurriendo la actividad relevante para los usuarios?\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"custom\": { \"drawStyle\": \"bars\", \"fillOpacity\": 40 },\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": { \"h\": 7, \"w\": 12, \"x\": 12, \"y\": 23 },\n      \"id\": 9,\n      \"options\": { \"legend\": { \"displayMode\": \"table\", \"placement\": \"bottom\", \"calcs\": [\"lastNotNull\"] } },\n      \"targets\": [\n  