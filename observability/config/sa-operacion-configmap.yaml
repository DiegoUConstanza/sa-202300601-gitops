  "sa-operacion.json": "{\n  \"annotations\": {\n    \"list\": [\n      {\n        \"builtIn\": 1,\n        \"datasource\": \"-- Grafana --\",\n        \"enable\": true,\n        \"hide\": true,\n        \"name\": \"Annotations & Alerts\",\n        \"type\": \"dashboard\"\n      }\n    ]\n  },\n  \"editable\": true,\n  \"fiscalYearStartMonth\": 0,\n  \"graphTooltip\": 1,\n  \"id\": null,\n  \"links\": [],\n  \"liveNow\": false,\n  \"panels\": [\n    {\n      \"collapsed\": false,\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 0 },\n      \"id\": 100,\n      \"title\": \"1. OBJETIVOS DE NIVEL DE SERVICIO (SLO) Y PRESUPUESTO DE ERROR\",\n      \"type\": \"row\"\n    },\n    {\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"mappings\": [],\n          \"max\": 1,\n          \"min\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"green\", \"value\": null },\n              { \"color\": \"#EAB839\", \"value\": 0.5 },\n              { \"color\": \"red\", \"value\": 0.9 }\n            ]\n          },\n          \"unit\": \"percentunit\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": { \"h\": 6, \"w\": 8, \"x\": 0, \"y\": 1 },\n      \"id\": 1,\n      \"options\": {\n        \"orientation\": \"auto\",\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false },\n        \"showThresholdLabels\": false,\n        \"showThresholdMarkers\": true\n      },\n      \"pluginVersion\": \"11.0.0\",\n      \"targets\": [\n        {\n          \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n          \"editorMode\": \"code\",\n          \"expr\": \"sa:gateway_error_budget_consumed:ratio_7d or vector(0)\",\n          \"legendFormat\": \"Presupuesto Consumido (7d)\",\n          \"range\": true,\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"SLO Disponibilidad: Presupuesto Consumido (7d)\",\n      \"description\": \"\xBFCu\xE1nto margen de error queda en la ventana de 7 d\xEDas? (Meta 99.5%, Presupuesto 0.5%)\",\n      \"type\": \"gauge\"\n    },\n    {\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"thresholds\" },\n          \"mappings\": [],\n          \"max\": 1,\n          \"min\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"green\", \"value\": null },\n              { \"color\": \"#EAB839\", \"value\": 0.5 },\n              { \"color\": \"red\", \"value\": 0.9 }\n            ]\n          },\n          \"unit\": \"percentunit\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": { \"h\": 6, \"w\": 8, \"x\": 8, \"y\": 1 },\n      \"id\": 2,\n      \"options\": {\n        \"orientation\": \"auto\",\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false },\n        \"showThresholdLabels\": false,\n        \"showThresholdMarkers\": true\n      },\n      \"pluginVersion\": \"11.0.0\",\n      \"targets\": [\n        {\n          \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n          \"editorMode\": \"code\",\n          \"expr\": \"(1 - (sum(rate(http_server_request_duration_seconds_bucket{namespace=\\\"sa-p8-prod\\\",app=\\\"gateway\\\",le=\\\"0.5\\\"}[7d])) or vector(1)) / (sum(rate(http_server_request_duration_seconds_count{namespace=\\\"sa-p8-prod\\\",app=\\\"gateway\\\"}[7d])) or vector(1))) / 0.05\",\n          \"legendFormat\": \"Presupuesto Consumido (7d)\",\n          \"range\": true,\n          \"refId\": \"A\"\n        }\n      ],\n      \"title\": \"SLO Latencia: Presupuesto Consumido (7d)\",\n      \"description\": \"\xBFCu\xE1nto margen de solicitudes lentas queda? (Meta 95% < 500ms, Presupuesto 5%)\",\n      \"type\": \"gauge\"\n    },\n    {\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"color\": { \"mode\": \"palette-classic\" },\n          \"custom\": { \"axisCenteredZero\": false, \"axisColorMode\": \"text\", \"drawStyle\": \"line\", \"lineInterpolation\": \"smooth\" },\n          \"mappings\": [],\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [{ \"color\": \"green\", \"value\": null }] },\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"gridPos\": { \"h\": 6, \"w\": 8, \"x\": 16, \"y\": 1 },\n      \"id\": 3,\n      \"options\": { \"legend\": { \"displayMode\": \"list\", \"placement\": \"bottom\" }, \"tooltip\": { \"mode\": \"single\" } },\n      \"targets\": [\n        {\n          \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n          \"editorMode\": \"code\",\n          \"expr\": \"(sa:gateway_error_ratio:rate3m / 0.005) or vector(0)\",\n          \"legendFormat\": \"Burn Rate (Ventana 3m)\",\n          \"range\": true,\n          \"refId\": \"A\"\n        },\n        {\n          \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n          \"editorMode\": \"code\",\n          \"expr\": \"(sa:gateway_error_ratio:rate30m / 0.005) or vector(0)\",\n          \"legendFormat\": \"Burn Rate (Ventana 30m)\",\n          \"range\": true,\n          \"refId\": \"B\"\n        }\n      ],\n      \"title\": \"Tasa de Quema Actual (Burn Rate)\",\n      \"description\": \"\xBFA qu\xE9 velocidad se consume el presupuesto? (1.0 = sostenible, >14.4 = cr\xEDtico)\",\n      \"type\": \"timeseries\"\n    },\n    {\n      \"collapsed\": false,\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 7 },\n      \"id\": 200,\n      \"title\": \"2. LAS CUATRO SE\xD1ALES DE ORO (GOLDEN SIGNALS)\",\n    