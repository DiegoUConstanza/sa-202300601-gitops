apiVersion: v1
data:
  sa-operacion.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "1. OBJETIVOS DE NIVEL DE SERVICIO (SLO) Y PRESUPUESTO DE ERROR",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 0.5 },
                  { "color": "red", "value": 0.9 }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 1 },
          "id": 1,
          "options": {
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sa:gateway_error_budget_consumed:ratio_7d or vector(0)",
              "legendFormat": "Presupuesto Consumido (7d)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "SLO Disponibilidad: Presupuesto Consumido (7d)",
          "description": "¿Cuánto margen de error queda en la ventana de 7 días? (Meta 99.5%, Presupuesto 0.5%)",
          "type": "gauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 0.5 },
                  { "color": "red", "value": 0.9 }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 1 },
          "id": 2,
          "options": {
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "(1 - (sum(rate({__name__=~\"http_server_request_duration(_seconds)?_bucket\",namespace=\"sa-p8-prod\",app=\"gateway\",le=\"0.5\"}[7d])) or vector(1)) / (sum(rate({__name__=~\"http_server_request_duration(_seconds)?_count\",namespace=\"sa-p8-prod\",app=\"gateway\"}[7d])) or vector(1))) / 0.05",
              "legendFormat": "Presupuesto Consumido (7d)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "SLO Latencia: Presupuesto Consumido (7d)",
          "description": "¿Cuánto margen de solicitudes lentas queda? (Meta 95% < 500ms, Presupuesto 5%)",
          "type": "gauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisCenteredZero": false, "axisColorMode": "text", "drawStyle": "line", "lineInterpolation": "smooth" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 1 },
          "id": 3,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "(sa:gateway_error_ratio:rate3m / 0.005) or vector(0)",
              "legendFormat": "Burn Rate (Ventana 3m)",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "(sa:gateway_error_ratio:rate30m / 0.005) or vector(0)",
              "legendFormat": "Burn Rate (Ventana 30m)",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Tasa de Quema Actual (Burn Rate)",
          "description": "¿A qué velocidad se consume el presupuesto? (1.0 = sostenible, >14.4 = crítico)",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 7 },
          "id": 200,
          "title": "2. LAS CUATRO SEÑALES DE ORO (GOLDEN SIGNALS)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 8 },
          "id": 4,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (app, le) (rate({__name__=~\"http_server_request_duration(_seconds)?_bucket\",namespace=\"sa-p8-prod\"}[2m])))",
              "legendFormat": "{{app}} (p95)",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum by (app, le) (rate({__name__=~\"http_server_request_duration(_seconds)?_bucket\",namespace=\"sa-p8-prod\"}[2m])))",
              "legendFormat": "{{app}} (p50)",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Señal 1: Latencia (p50 y p95 por Microservicio)",
          "description": "¿Qué tan rápido responde cada microservicio a las peticiones?",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 8 },
          "id": 5,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "mean"] } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum by (app) (rate({__name__=~\"http_server_request_duration(_seconds)?_count\",namespace=\"sa-p8-prod\"}[2m]))",
              "legendFormat": "{{app}} (req/s)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Señal 2: Tráfico (Peticiones por Segundo)",
          "description": "¿Cuánta demanda está procesando cada servicio?",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "bars", "fillOpacity": 50 },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 15 },
          "id": 6,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "((sum by (app) (rate({__name__=~\"http_server_request_duration(_seconds)?_count\",namespace=\"sa-p8-prod\",http_response_status_code=~\"5..\"}[2m]))) / (sum by (app) (rate({__name__=~\"http_server_request_duration(_seconds)?_count\",namespace=\"sa-p8-prod\"}[2m])))) or (0 * sum by (app) (rate({__name__=~\"http_server_request_duration(_seconds)?_count\",namespace=\"sa-p8-prod\"}[2m])))",
              "legendFormat": "{{app}} Tasa 5xx",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Señal 3: Errores (Tasa de Respuestas HTTP 5xx)",
          "description": "¿Quién está fallando y en qué porcentaje?",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 15 },
          "id": 7,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"sa-p8-prod\",container!=\"\"}[2m])) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"sa-p8-prod\",resource=\"cpu\",container!=\"\"})",
              "legendFormat": "{{pod}} (CPU vs Limit)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Señal 4: Saturación (Uso de CPU relativo a límites)",
          "description": "¿Qué tan cerca del límite de CPU está operando cada Pod?",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 },
          "id": 300,
          "title": "3. MÉTRICAS DE NEGOCIO Y DESPLIEGUE CANARY",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line" },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 23 },
          "id": 8,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum by (resultado) (rate(sa_logins_total[2m]))",
              "legendFormat": "Logins ({{resultado}})",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "rate(sa_usuarios_registrados_total[2m])",
              "legendFormat": "Usuarios Registrados/s",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "rate(sa_modulos_completados_total[2m])",
              "legendFormat": "Módulos Completados/s",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Métricas de Negocio",
          "description": "¿Está ocurriendo la actividad relevante para los usuarios?",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "bars", "fillOpacity": 40 },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 23 },
          "id": 9,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum by (rollouts_pod_template_hash) (kube_pod_status_phase{namespace=\"sa-p8-prod\",pod=~\"progreso-service-.*\",phase=\"Running\"})",
              "legendFormat": "Hash Pod: {{rollouts_pod_template_hash}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Estado del Canary: Réplicas Activas por Versión",
          "description": "¿Existe un despliegue progresivo activo en progreso-service?",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["observability", "p10", "slo", "golden-signals", "usac"],
      "time": { "from": "now-30m", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s", "1m"] },
      "timezone": "browser",
      "title": "SA-Operacion: Tablero de las 4 Señales de Oro y SLOs",
      "uid": "sa-operacion-p10"
    }
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: sa-operacion-dashboard
  namespace: observability
