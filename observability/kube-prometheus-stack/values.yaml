# ─────────────────────────────────────────────────────────────────────────────
# kube-prometheus-stack values.yaml — Perfil liviano compatible con Kyverno
# ─────────────────────────────────────────────────────────────────────────────

defaultRules:
  create: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

nodeExporter:
  enabled: false

prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 20m
      memory: 64Mi
  prometheusConfigReloader:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 32Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534

prometheus:
  prometheusSpec:
    retention: 10d
    scrapeInterval: 15s
    evaluationInterval: 15s
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      limits:
        cpu: 500m
        memory: 1024Mi
      requests:
        cpu: 50m
        memory: 256Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 20m
        memory: 64Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534

grafana:
  enabled: true
  defaultDashboardsEnabled: false
  adminPassword: "admin"
  resources:
    limits:
      cpu: 300m
      memory: 512Mi
    requests:
      cpu: 30m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 32Mi
    datasources:
      enabled: false
  additionalDataSources:
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.observability.svc:3100
      jsonData:
        httpMethod: GET
        tracesToLogsV2:
          datasourceUid: loki
          customQuery: true
          query: '{app=~"gateway|auth-service|progreso-service"} |= "${__trace.id}"'
          tags:
            - key: app
              value: app
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.observability.svc:3100
      jsonData:
        derivedFields:
          - datasourceUid: tempo
            matcherRegex: '"(?:trace_id|traceId)":\s*"([a-f0-9]{32})"'
            name: TraceID
            url: '$${__value.raw}'
