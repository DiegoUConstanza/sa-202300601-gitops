apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway.fullname" . }}-config
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
data:
  PORT: "{{ .Values.service.port }}"
  GATEWAY_PORT: "{{ .Values.service.port }}"
  NODE_ENV: "{{ .Values.env.nodeEnv | default "production" }}"
  AUTH_SERVICE_URL: "{{ .Values.env.authServiceUrl | default "http://auth-service:3000" }}"
  CURSOS_SERVICE_URL: "{{ .Values.env.cursosServiceUrl | default "http://cursos-service:3001" }}"
  INSCRIPCIONES_SERVICE_URL: "{{ .Values.env.inscripcionesServiceUrl | default "http://inscripciones-service:3002" }}"
  PROGRESO_SERVICE_URL: "{{ .Values.env.progresoServiceUrl | default "http://progreso-service:8000" }}"
  OTEL_SERVICE_NAME: "gateway"
  OTEL_EXPORTER_OTLP_ENDPOINT: "{{ .Values.env.otelOtlpEndpoint | default "http://otel-collector.observability.svc:4318" }}"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "prometheus"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_SEMCONV_STABILITY_OPT_IN: "http"
  OTEL_EXPORTER_PROMETHEUS_HOST: "0.0.0.0"
  OTEL_EXPORTER_PROMETHEUS_PORT: "9464"
