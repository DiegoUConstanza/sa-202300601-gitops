replicaCount: 2

image:
  repository: us-west1-docker.pkg.dev/project-d92eea96-0bda-4489-bb7/sa-images/gateway
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8080

resources:
  limits:
    cpu: 400m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

env:
  nodeEnv: production
  authServiceUrl: "http://auth-service:3000"
  cursosServiceUrl: "http://cursos-service:3001"
  inscripcionesServiceUrl: "http://inscripciones-service:3002"
  progresoServiceUrl: "http://progreso-service:8000"
