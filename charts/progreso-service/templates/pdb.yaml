apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "progreso-service.fullname" . }}-pdb
  labels:
    {{- include "progreso-service.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "progreso-service.selectorLabels" . | nindent 6 }}
