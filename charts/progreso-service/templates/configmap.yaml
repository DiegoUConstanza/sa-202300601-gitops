apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "progreso-service.fullname" . }}-config
  labels:
    {{- include "progreso-service.labels" . | nindent 4 }}
data:
  PORT: "{{ .Values.service.port }}"
  RABBITMQ_HOST: "{{ .Values.env.rabbitmqHost | default "rabbitmq.sa-p8-prod.svc.cluster.local" }}"
  RABBITMQ_PORT: "{{ .Values.env.rabbitmqPort | default "5672" }}"
  RABBITMQ_USER: "{{ .Values.env.rabbitmqUser | default "sa_user" }}"
  OTEL_SERVICE_NAME: "progreso-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "{{ .Values.env.otelOtlpEndpoint | default "http://otel-collector.observability.svc:4318" }}"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "prometheus"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_SEMCONV_STABILITY_OPT_IN: "http"
  OTEL_EXPORTER_PROMETHEUS_HOST: "0.0.0.0"
  OTEL_EXPORTER_PROMETHEUS_PORT: "9464"
  FAIL_MODE: "{{ .Values.env.failMode | default "false" }}"
