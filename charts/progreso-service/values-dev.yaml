replicaCount: 1

image:
  repository: us-west1-docker.pkg.dev/project-d92eea96-0bda-4489-bb7/sa-images/progreso-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

env:
  rabbitmqHost: "rabbitmq.sa-p8-dev.svc.cluster.local"
  rabbitmqPort: "5672"
  rabbitmqUser: "sa_user"
